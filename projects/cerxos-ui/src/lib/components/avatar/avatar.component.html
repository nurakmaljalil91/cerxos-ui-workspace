<div
  [class]="avatarClass"
  [attr.role]="showImage ? null : 'img'"
  [attr.aria-label]="showImage ? null : fallbackLabel"
>
  @if (showImage) {
    <img
      [attr.src]="src"
      [attr.alt]="altText"
      class="h-full w-full object-cover"
      (error)="onImageError()"
    />
  } @else {
    <span [class]="fallbackClass" aria-hidden="true">{{ fallbackText }}</span>
  }
</div>
