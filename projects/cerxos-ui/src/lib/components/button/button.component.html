<button
  [class]="buttonClass"
  [attr.type]="type"
  [disabled]="isDisabled"
  [attr.aria-busy]="loading ? 'true' : null"
  [attr.aria-label]="ariaLabelValue"
>
  @if (loading) {
    <span
      class="h-4 w-4 animate-spin rounded-full border-2 border-current border-t-transparent"
      aria-hidden="true"
    ></span>
  }

  @if (leadingIconName; as iconName) {
    <cxs-icon [name]="iconName" [size]="size"></cxs-icon>
  }

  <ng-content select="[cxsButtonIcon]"></ng-content>

  @if (!iconOnly) {
    <span class="truncate">
      <ng-content></ng-content>
    </span>
  }

  @if (trailingIconName; as iconName) {
    <cxs-icon [name]="iconName" [size]="size"></cxs-icon>
  }
</button>
