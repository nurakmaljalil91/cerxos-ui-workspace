<button
  [class]="buttonClass"
  [attr.type]="type"
  [disabled]="isDisabled"
  [attr.aria-busy]="loading ? 'true' : null"
>
  @if (loading) {
    <span
      class="h-4 w-4 animate-spin rounded-full border-2 border-current border-t-transparent"
      aria-hidden="true"
    ></span>
  }
  <ng-content select="[cxsButtonIcon]"></ng-content>
  <span class="truncate">
    <ng-content></ng-content>
  </span>
</button>
