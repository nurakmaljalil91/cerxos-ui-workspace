<div [class]="wrapperClass">
  @if (label) {
    <label [class]="labelClass" [attr.id]="labelId" [attr.for]="textareaId">
      {{ label }}
    </label>
  }
  <textarea
    [class]="textareaClass"
    [attr.id]="textareaId"
    [attr.name]="name"
    [attr.placeholder]="placeholder"
    [attr.maxlength]="maxlength ?? null"
    [attr.spellcheck]="spellcheck === null ? null : spellcheck"
    [attr.aria-label]="ariaLabelValue"
    [attr.aria-labelledby]="labelId"
    [attr.aria-describedby]="ariaDescribedbyValue"
    [attr.aria-invalid]="invalid ? 'true' : null"
    [rows]="rows"
    [disabled]="isDisabled"
    [readonly]="readonly"
    [required]="required"
    [value]="value"
    (input)="onInput($event)"
    (blur)="onBlur()"
  ></textarea>
  @if (invalid) {
    <div [class]="errorClass" [attr.id]="errorId" aria-live="polite">
      <ng-content select="[cxsTextareaError]"></ng-content>
    </div>
  }
</div>
