<div [class]="wrapperClass">
  @if (label) {
    <label [class]="labelClass" [attr.id]="labelId" [attr.for]="selectId">
      {{ label }}
    </label>
  }
  <div class="relative">
    <select
      [class]="selectClass"
      [attr.id]="selectId"
      [attr.name]="name"
      [attr.aria-label]="ariaLabelValue"
      [attr.aria-labelledby]="labelId"
      [attr.aria-describedby]="ariaDescribedby"
      [attr.aria-invalid]="invalid ? 'true' : null"
      [disabled]="isDisabled"
      [required]="required"
      [value]="selectValue"
      (change)="onSelectChange($event)"
      (blur)="onBlur()"
      >
      @if (placeholder) {
        <option [value]="placeholderValue" disabled>
          {{ placeholder }}
        </option>
      }
      <ng-content></ng-content>
    </select>
    <span
      class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-[var(--cxs-color-on-surface-muted)]"
      aria-hidden="true"
      >
      <svg viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4">
        <path
          fill-rule="evenodd"
          d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 10.94l3.71-3.71a.75.75 0 1 1 1.06 1.06l-4.24 4.25a.75.75 0 0 1-1.06 0L5.21 8.29a.75.75 0 0 1 .02-1.08Z"
          clip-rule="evenodd"
          />
      </svg>
    </span>
  </div>
</div>
