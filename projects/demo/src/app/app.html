<main class="min-h-screen bg-(--cxs-color-surface) text-(--cxs-color-on-surface)">
  <section class="mx-auto flex max-w-4xl flex-col gap-6 px-6 py-16">
    <header class="flex flex-col gap-2">
      <p class="text-sm uppercase tracking-[0.25em] text-(--cxs-color-primary)">Cerxos UI</p>
      <h1 class="text-3xl font-semibold">Component preview</h1>
      <p class="max-w-xl text-sm text-slate-600">
        This demo app renders the library components with Tailwind + tokens.
      </p>
    </header>

    <div class="flex flex-wrap items-center gap-4">
      <cxs-button>Primary</cxs-button>
      <cxs-button variant="secondary">Secondary</cxs-button>
      <cxs-button variant="ghost">Ghost</cxs-button>
      <cxs-button size="sm">Small</cxs-button>
      <cxs-button size="lg">Large</cxs-button>
      <cxs-button [loading]="true">Loading</cxs-button>
      <cxs-button [disabled]="true">Disabled</cxs-button>
    </div>

    <div class="grid gap-3 max-w-sm">
      <cxs-input placeholder="Email address" type="email"></cxs-input>
      <cxs-input placeholder="Search" type="search" variant="filled"></cxs-input>
      <cxs-input placeholder="Disabled input" [disabled]="true"></cxs-input>
      <cxs-input placeholder="Invalid input" [invalid]="true" value="Invalid"></cxs-input>
    </div>
  </section>
</main>
