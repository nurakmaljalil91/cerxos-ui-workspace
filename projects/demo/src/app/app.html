<main class="min-h-screen bg-(--cxs-color-surface) text-(--cxs-color-on-surface)" [cxsTheme]="themeMode">
  <header class="mx-auto flex max-w-4xl flex-col gap-2 px-6 py-16">
    <p class="text-sm uppercase tracking-[0.25em] text-(--cxs-color-primary)">Cerxos UI</p>
    <h1 class="text-3xl font-semibold">Component preview</h1>
    <p class="max-w-xl text-sm text-slate-600">
      This demo app renders the library components with Tailwind + tokens.
    </p>
    <div class="flex flex-wrap items-center gap-3 pt-2">
      <cxs-button variant="secondary" [disabled]="themeMode === 'light'" (click)="setTheme('light')">
        Light
      </cxs-button>
      <cxs-button variant="secondary" [disabled]="themeMode === 'dark'" (click)="setTheme('dark')">
        Dark
      </cxs-button>
      <cxs-button variant="secondary" [disabled]="themeMode === 'system'" (click)="setTheme('system')">
        System
      </cxs-button>
      <span class="text-xs text-(--cxs-color-on-surface-muted)">
        System preference: {{ systemPrefersDark ? 'Dark' : 'Light' }}
      </span>
    </div>
    <div class="flex flex-wrap items-center gap-3 pt-4">
      <cxs-button size="sm" variant="secondary" routerLink="/">Components</cxs-button>
      <cxs-button size="sm" variant="ghost" routerLink="/login">Login page</cxs-button>
    </div>
  </header>

  <router-outlet></router-outlet>
</main>
